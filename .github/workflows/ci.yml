name: Gooo bounded self-improvement cycle v0.2 CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Go 1.27 deterministic v0.2 cycle
    runs-on: ubuntu-latest
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Verify Go 1.27
        run: test "$(go env GOVERSION)" = "go1.27.0"
      - name: Prepare caller-owned evidence directories
        run: |
          echo "METRICS_DIR=$RUNNER_TEMP/gooo-v02-metrics" >> "$GITHUB_ENV"
          echo "CYCLE_WORK_ROOT=$RUNNER_TEMP/gooo-v02-cycle-work" >> "$GITHUB_ENV"
          echo "CYCLE_INTEGRATION_OUT=$RUNNER_TEMP/gooo-v02-integration.json" >> "$GITHUB_ENV"
          echo "CYCLE_OUTPUT_DIR=$RUNNER_TEMP/gooo-v02-cycle-output" >> "$GITHUB_ENV"
          echo "LIVE_WORK_ROOT=$RUNNER_TEMP/gooo-v02-live-work" >> "$GITHUB_ENV"
          echo "LIVE_OUTPUT_DIR=$RUNNER_TEMP/gooo-v02-live-output" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/gooo-v02-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/gooo-v02-metrics" "$RUNNER_TEMP/gooo-v02-cycle-work" "$RUNNER_TEMP/gooo-v02-live-work" "$RUNNER_TEMP/gooo-v02-evidence"
      - name: Measure compiler package
        run: bash scripts/measure-stage.sh compile "$METRICS_DIR/compile.json" go build -buildmode=archive -trimpath -o "$RUNNER_TEMP/gooo-v02-cycle.a" ./internal/cycle
      - name: Measure command build
        run: bash scripts/measure-stage.sh build "$METRICS_DIR/build.json" go build -trimpath -o "$RUNNER_TEMP/gooo-v02-cycle-bin" ./cmd/gooo-bounded-self-change-compiler
      - name: Measure Go tests
        shell: bash
        run: bash scripts/measure-stage.sh test "$METRICS_DIR/test.json" bash -c 'set -o pipefail; go test -json ./... | tee "$RUNNER_TEMP/gooo-v02-go-test-events.jsonl"'
      - name: Measure fixed v0.2 conformance
        shell: bash
        run: CYCLE_WORK_ROOT="$CYCLE_WORK_ROOT" bash scripts/measure-stage.sh conformance "$METRICS_DIR/conformance.json" bash scripts/conformance-v2.sh "$RUNNER_TEMP/gooo-v02-cycle-bin"
      - name: Measure caller-owned integration
        shell: bash
        run: CYCLE_WORK_ROOT="$CYCLE_WORK_ROOT" CYCLE_INTEGRATION_OUT="$CYCLE_INTEGRATION_OUT" bash scripts/measure-stage.sh integration "$METRICS_DIR/integration.json" bash scripts/integration-v2.sh
      - name: Finalize internal v0.2 cycle
        shell: bash
        run: CYCLE_WORK_ROOT="$CYCLE_WORK_ROOT" METRICS_DIR="$METRICS_DIR" CYCLE_INTEGRATION_OUT="$CYCLE_INTEGRATION_OUT" CYCLE_OUTPUT_DIR="$CYCLE_OUTPUT_DIR" bash scripts/finalize-v2.sh "$RUNNER_TEMP/gooo-v02-cycle-bin"
      - name: Observe immutable live ledger v0.50
        shell: bash
        run: LIVE_WORK_ROOT="$LIVE_WORK_ROOT" LIVE_OUTPUT_DIR="$LIVE_OUTPUT_DIR" bash scripts/live-v2.sh "$RUNNER_TEMP/gooo-v02-cycle-bin"
      - name: Assemble machine evidence
        run: bash scripts/assemble-ci-evidence-v2.sh "$GITHUB_WORKSPACE" "$CYCLE_OUTPUT_DIR" "$LIVE_OUTPUT_DIR" "$METRICS_DIR" "$RUNNER_TEMP/gooo-v02-go-test-events.jsonl" "$EVIDENCE_DIR"
      - name: Verify exact v0.2 vectors and authority
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .cycle.decision == "CLOSED" and
            .cycle.vector == {total:12,closed:4,unknown:4,refuted:4} and
            .live_v050.decision == "UNKNOWN" and
            .live_v050.claim.unknown_class == "HUMAN_EXTERNAL_EVIDENCE_REQUIRED" and
            .tests.failed == 0 and .tests.unknown == 0 and
            .runtime_authority == {repository_writes:0,remote_writes:0,apply_authority:0,commit_authority:0,merge_authority:0,tag_authority:0,release_authority:0,local_test_executions:0,cross_project_required_gates:0} and
            .local_authority == {test:0,build:0,vet:0,lint:0,format:0,check:0,conformance:0,integration:0} and
            .remote_authority.cross_project_required_gates == 0 and
            .artifacts.required_output_count == 8 and .artifacts.generated_count == 8 and .artifacts.generated_bytes > 0 and
            .historical_failures_preserved == true and .metric_summary_mode == "per_indicator_only" and
            ([.stage_measurements | to_entries[] | .value.wall_ms] | all(. >= 0)) and
            ([.stage_measurements | to_entries[] | .value.peak_rss_kib] | all(. >= 0))
          ' "$EVIDENCE_DIR/ci-evidence.json" >/dev/null
          test "$(find "$CYCLE_OUTPUT_DIR" -maxdepth 1 -type f | awk 'END {print NR+0}')" -eq 8
          test "$(find "$LIVE_OUTPUT_DIR" -maxdepth 1 -type f | awk 'END {print NR+0}')" -eq 8
      - name: Publish v0.2 human report
        run: cat "$EVIDENCE_DIR/human-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload v0.2 machine and cycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: gooo-bounded-self-change-v0.2-evidence-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
